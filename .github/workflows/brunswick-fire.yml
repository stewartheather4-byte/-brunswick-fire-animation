name: Brunswick + Ainslie Wildfire Animation

on:
  workflow_dispatch:

  schedule:
    - cron: '0 23 * * *'
      timezone: "America/Vancouver"

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: brunswick-ainslie-daily
  cancel-in-progress: false

jobs:
  update-animation:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run wildfire animation
        run: |
          python fire_animation.py

      - name: Save updated FIRMS data and frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data frames status

          if git diff --cached --quiet; then
            echo "No saved data changed."
          else
            git commit -m "Update Brunswick wildfire animation"
            git push
          fi

      - name: Create Latest Wildfire Animation release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-animation >/dev/null 2>&1; then
            gh release create latest-animation \
              --title "Latest Wildfire Animation" \
              --notes "Automatically updated Brunswick Creek V10742 + Ainslie Creek V10755 wildfire animation."
          fi

      - name: Upload latest animation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest-animation \
            output/Brunswick_Ainslie_SIMPLE.mp4 \
            output/Brunswick_Ainslie_SLIDESHOW_ONCE.gif \
            output/Brunswick_Ainslie_SLIDESHOW.html \
            output/Brunswick_Ainslie_LATEST.png \
            --clobber

      - name: Prepare Brunswick website
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html

          cp \
            output/Brunswick_Ainslie_SLIDESHOW.html \
            _site/Brunswick_Ainslie_SLIDESHOW.html

          touch _site/.nojekyll

          echo "Website files:"
          ls -lh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Brunswick website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish Brunswick website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Stop automatic updates when fire stops expanding
        if: ${{ hashFiles('status/COMPLETE.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fire expansion has stopped for the required period."
          echo "Disabling daily workflow."

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/brunswick-fire.yml/disable"
