<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>Brunswick Complex Wildfire</title>
<style>
html,body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; }
#frame { width:100vw; height:100vh; object-fit:contain; background:#000; }
#fs { position:fixed; right:14px; bottom:14px; z-index:10; border:0; border-radius:10px;
       padding:10px 14px; font-size:16px; background:rgba(0,0,0,.55); color:#fff; }
</style>
</head>
<body>
<img id="frame" alt="Brunswick wildfire animation">
<button id="fs" type="button">Full screen</button>
<script>
const frames = ["frames/frame_2026-07-02.png", "frames/frame_2026-07-03.png", "frames/frame_2026-07-04.png", "frames/frame_2026-07-05.png", "frames/frame_2026-07-06.png", "frames/frame_2026-07-07.png", "frames/frame_2026-07-08.png", "frames/frame_2026-07-09.png", "frames/frame_2026-07-10.png", "frames/frame_2026-07-11.png", "frames/frame_2026-07-12.png", "frames/frame_2026-07-13.png", "frames/frame_2026-07-14.png", "frames/frame_2026-07-15.png", "frames/frame_2026-07-16.png", "frames/frame_2026-07-17.png", "frames/frame_2026-07-18.png", "frames/frame_2026-07-19.png", "frames/frame_2026-07-20.png", "frames/frame_2026-07-21.png", "frames/frame_2026-07-22.png", "frames/frame_2026-07-23.png", "frames/frame_2026-07-24.png", "frames/frame_2026-07-25.png", "frames/frame_2026-07-26.png", "frames/frame_2026-07-27.png", "frames/frame_2026-07-28.png", "frames/frame_2026-07-29.png", "frames/frame_2026-07-30.png", "frames/frame_2026-07-31.png", "frames/frame_2026-08-01.png", "frames/frame_2026-08-02.png", "frames/frame_2026-08-03.png", "frames/frame_2026-08-04.png", "frames/frame_2026-08-05.png", "frames/frame_2026-08-06.png", "frames/frame_2026-08-07.png", "frames/frame_2026-08-08.png", "frames/frame_2026-08-09.png", "frames/frame_2026-08-10.png", "frames/frame_2026-08-11.png", "frames/frame_2026-08-12.png", "frames/frame_2026-08-13.png", "frames/frame_2026-08-14.png", "frames/frame_2026-08-15.png", "frames/frame_2026-08-16.png", "frames/frame_2026-08-17.png", "frames/frame_2026-08-18.png", "frames/frame_2026-08-19.png", "frames/frame_2026-08-20.png", "frames/frame_2026-08-21.png", "frames/frame_2026-08-22.png"];
const img = document.getElementById('frame');
const fs = document.getElementById('fs');
let i = 0;
const delay = 750;

function showNext() {
  img.src = frames[i];
  if (i < frames.length - 1) {
    i += 1;
    window.setTimeout(showNext, delay);
  }
  // No timer after the last image: it stays displayed until the user closes the page.
}

fs.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {}
});

if (frames.length) showNext();
</script>
</body>
</html>
